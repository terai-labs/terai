name: Publish

on:
  push:
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release.yml'
      - '.github/composite-actions/install/**'
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build packages
        run: pnpm build

      - name: Validate packages
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run packages

      - name: Update npm for trusted publishing
        if: github.ref == 'refs/heads/master'
        run: npm install --global npm@12.2.0

      - name: Publish packages
        if: github.ref == 'refs/heads/master'
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Restore source before snapshot versioning
        if: steps.changesets.outputs.has-changesets == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Release to dev tag
        if: steps.changesets.outputs.has-changesets == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm changeset version --snapshot dev
          pnpm build
          pnpm changeset publish --tag dev
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
